[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "opencover-studio"
version = "0.1.0"
description = "Local Windows desktop shell for auditable singing voice conversion pipelines"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = { text = "MIT" }
dependencies = [
  "PySide6>=6.7,<7",
  "pydantic>=2.7,<3",
  "PyYAML>=6,<7",
  "requests>=2.32,<3",
  "platformdirs>=4,<5",
  "numpy>=1.26,<3",
  "soundfile>=0.12,<1",
  "pyloudnorm>=0.1.1,<1",
  "Pillow>=10,<12",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "pytest-qt>=4.4,<5", "pyinstaller>=6.10,<7"]

[project.scripts]
opencover-studio = "opencover.ui.application:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
